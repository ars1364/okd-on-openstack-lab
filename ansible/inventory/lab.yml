---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python | default('/usr/bin/python3') }}"
  vars:
    # Path to OpenStack credentials. The deploy host should have a clouds.yaml
    # entry named per `openstack_cloud_name` below. The Kolla lab default is
    # /etc/kolla/clouds.yaml (admin scope, public Keystone via 172.17.17.115).
    openstack_clouds_yaml: "{{ lookup('env','OS_CLIENT_CONFIG_FILE') | default('/etc/kolla/clouds.yaml', true) }}"
    openstack_cloud_name: "kolla-admin"

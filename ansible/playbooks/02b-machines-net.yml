---
# Pre-create the OKD "machines subnet" with DNS nameservers set, so that VMs
# scheduled into it get usable DNS via DHCP. Otherwise the OKD installer
# creates a subnet with empty dns_nameservers and bootstrap/masters end up
# unable to resolve quay.io (P9 in PITFALLS.md).
#
# The install-config template references the resulting subnet UUID via
# platform.openstack.machinesSubnet so the installer reuses it instead of
# creating its own.

- name: Pre-create machines network+subnet+router with DNS set
  hosts: localhost
  gather_facts: false
  tasks:

    - name: Resolve okd project id
      openstack.cloud.project_info:
        cloud: "{{ openstack_cloud_name }}"
        name: "{{ okd_project_name }}"
      register: okd_proj

    - name: Ensure machines network exists
      openstack.cloud.network:
        cloud: "{{ openstack_cloud_name }}"
        project: "{{ okd_proj.projects[0].id }}"
        name: "{{ okd_cluster_name }}-machines-net"
        external: false
        state: present
      register: machines_net

    - name: Ensure machines subnet exists (with DNS pre-set + VIP carve-out)
      openstack.cloud.subnet:
        cloud: "{{ openstack_cloud_name }}"
        project: "{{ okd_proj.projects[0].id }}"
        name: "{{ okd_cluster_name }}-machines-subnet"
        network_name: "{{ machines_net.network.name }}"
        cidr: "{{ okd_machine_cidr }}"
        ip_version: 4
        enable_dhcp: true
        dns_nameservers: "{{ okd_subnet_dns_nameservers }}"
        # Reserve 10.0.0.0/24 for OKD apiVIP+ingressVIP. OKD installer
        # rejects VIPs that fall in the DHCP allocation pool. Keep DHCP
        # leases to 10.0.1.0+ (P10 in PITFALLS.md).
        allocation_pool_start: "{{ okd_machines_alloc_start }}"
        allocation_pool_end: "{{ okd_machines_alloc_end }}"
        state: present
      register: machines_subnet

    - name: Look up the external network ID (admin-scope module call to bypass project filter)
      openstack.cloud.networks_info:
        cloud: "{{ openstack_cloud_name }}"
        filters:
          name: "{{ okd_external_network }}"
      register: ext_net_info

    - name: Sanity ext network found
      ansible.builtin.assert:
        that: ext_net_info.networks | length > 0
        fail_msg: "External network {{ okd_external_network }} not found"

    - name: Ensure machines router exists with external gateway (use UUIDs to dodge project scope)
      openstack.cloud.router:
        cloud: "{{ openstack_cloud_name }}"
        project: "{{ okd_proj.projects[0].id }}"
        name: "{{ okd_cluster_name }}-router"
        network: "{{ ext_net_info.networks[0].id }}"
        interfaces:
          - "{{ machines_subnet.subnet.id }}"
        state: present
      register: machines_router

    - name: Persist machines subnet UUID + router UUID for install-config
      ansible.builtin.copy:
        dest: "{{ okd_cluster_dir }}/.machines-net.yml"
        mode: "0600"
        content: |
          okd_machines_subnet_id: "{{ machines_subnet.subnet.id }}"
          okd_machines_network_id: "{{ machines_net.network.id }}"
          okd_machines_router_id: "{{ machines_router.router.id }}"

    - name: Show machines network details
      ansible.builtin.debug:
        msg:
          - "machines network : {{ machines_net.network.name }} id={{ machines_net.network.id }}"
          - "machines subnet  : {{ machines_subnet.subnet.name }} id={{ machines_subnet.subnet.id }} cidr={{ okd_machine_cidr }} dns={{ okd_subnet_dns_nameservers }}"
          - "machines router  : {{ machines_router.router.name }} ext={{ okd_external_network }}"
